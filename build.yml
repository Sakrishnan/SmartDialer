name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create project files
        run: |
          printf 'android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2048m\n' > gradle.properties
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "SmartDialer"
          include(":app")
          EOF_FILE
          cat > build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.smartdialer"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.smartdialer"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.mlkit:text-recognition:16.0.1")
          }
          EOF_FILE
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/file_paths.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <paths><cache-path name="scans" path="." /></paths>
          EOF_FILE
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/themes.xml <<'EOF_FILE'
          <resources><style name="AppTheme" parent="Theme.AppCompat.DayNight.DarkActionBar" /></resources>
          EOF_FILE
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.READ_PHONE_STATE" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.telephony" android:required="false" />
              <application android:label="Smart Dialer" android:theme="@style/AppTheme">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".OverlayService" android:exported="false" />
                  <provider android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false" android:grantUriPermissions="true">
                      <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p app/src/main/java/com/example/smartdialer
          cat > app/src/main/java/com/example/smartdialer/Client.kt <<'EOF_FILE'
          package com.example.smartdialer
          
          import android.content.Context
          import android.graphics.Rect
          import com.google.mlkit.vision.text.Text
          import org.json.JSONArray
          import org.json.JSONObject
          import java.text.SimpleDateFormat
          import java.util.Calendar
          import java.util.Locale
          import kotlin.math.abs
          
          data class Client(
              val name: String,
              val phone: String,
              val meetingDay: Int,
              val nach: String,
              val lastPaid: String // MM/dd/yyyy
          ) {
              /** Red rule: day-of-month of "last paid on" is later than the meeting day. */
              val isLate: Boolean
                  get() = try {
                      val f = SimpleDateFormat("M/d/yyyy", Locale.US).apply { isLenient = false }
                      val c = Calendar.getInstance().apply { time = f.parse(lastPaid)!! }
                      c.get(Calendar.DAY_OF_MONTH) > meetingDay
                  } catch (e: Exception) { false }
          }
          
          object Store {
              private const val PREF = "dialer"
              fun save(ctx: Context, list: List<Client>) {
                  val arr = JSONArray()
                  list.forEach {
                      arr.put(JSONObject().put("n", it.name).put("p", it.phone).put("d", it.meetingDay)
                          .put("h", it.nach).put("l", it.lastPaid))
                  }
                  ctx.getSharedPreferences(PREF, 0).edit().putString("clients", arr.toString()).apply()
              }
              fun load(ctx: Context): List<Client> {
                  val s = ctx.getSharedPreferences(PREF, 0).getString("clients", "[]")!!
                  val arr = JSONArray(s)
                  return (0 until arr.length()).map {
                      val o = arr.getJSONObject(it)
                      Client(o.getString("n"), o.getString("p"), o.getInt("d"), o.getString("h"), o.getString("l"))
                  }
              }
          }
          
          object SheetParser {
              private val dateFind = Regex("""\d{1,2}/\d{1,2}/\d{4}""")
              private val phoneRx = Regex("""^[6-9]\d{9}$""")
              private val dayRx = Regex("""^\d{1,2}$""")
          
              private class W(val t: String, val b: Rect) {
                  val cy: Int get() = b.centerY()
              }
          
              private class R(val name: String, val phone: String, val day: Int, val nach: String, val last: String)
          
              /**
               * Each mobile number is the anchor of one table row. Everything else is picked relative to it:
               *  - name       = words to the LEFT of the mobile number (the Customer Name column), so Scheme Name can never be used
               *  - meeting day= a 1-2 digit number to the right
               *  - last paid  = a date to the right
               *  - NACH       = letters between meeting day and last paid date
               * Only words at the same height as the phone number (within 60% of the row spacing) are used,
               * so a tilted or curved photo still works.
               */
              fun parse(text: Text): List<Client> {
                  val words = mutableListOf<W>()
                  val lineBoxes = mutableListOf<W>()
                  for (blk in text.textBlocks) for (ln in blk.lines) {
                      ln.boundingBox?.let { lineBoxes.add(W(ln.text.trim(), it)) }
                      for (el in ln.elements) el.boundingBox?.let { words.add(W(el.text.trim(), it)) }
                  }
                  val phones = mutableListOf<Pair<String, W>>()
                  fun addPhone(num: String, w: W) {
                      if (phones.none { it.first == num && abs(it.second.cy - w.cy) < 10 }) phones.add(num to w)
                  }
                  words.forEach { if (phoneRx.matches(it.t)) addPhone(it.t, it) }
                  lineBoxes.forEach { val s = it.t.replace(" ", ""); if (phoneRx.matches(s)) addPhone(s, it) }
                  val sorted = phones.sortedBy { it.second.cy }
                  if (sorted.isEmpty()) return emptyList()
          
                  val diffs = sorted.zipWithNext { a, b -> b.second.cy - a.second.cy }.filter { it > 5 }.sorted()
                  val pitch = if (diffs.isEmpty()) 40 else diffs[diffs.size / 2]
                  val win = pitch * 0.6
          
                  val raw = mutableListOf<R>()
                  for ((num, p) in sorted) {
                      fun near(pred: (W) -> Boolean): W? =
                          words.filter { pred(it) && abs(it.cy - p.cy) < win }.minByOrNull { abs(it.cy - p.cy) }
          
                      // name: words left of the phone number
                      val tokens = words.filter { it.b.right <= p.b.left + 15 && abs(it.cy - p.cy) < win }
                          .sortedBy { it.b.left }
                          .map { w -> w.t.filter { c -> c.isLetter() || c == '.' } }
                          .filter { it.isNotEmpty() }
                      val firstUpper = tokens.firstOrNull()?.none { it.isLowerCase() } ?: false
                      val name = tokens.filter { !firstUpper || it.none { c -> c.isLowerCase() } }
                          .joinToString(" ").trim().ifEmpty { num }
          
                      val dayW = near { dayRx.matches(it.t) && it.b.left > p.b.right && it.t.toInt() in 1..31 }
                      val dateW = near { dateFind.containsMatchIn(it.t) && it.b.left > p.b.right }
                      val date = dateW?.let { dateFind.find(it.t)!!.value } ?: ""
          
                      val lo = dayW?.b?.right ?: dateW?.let { it.b.left - 2 * it.b.width() } ?: Int.MAX_VALUE
                      val hi = dateW?.b?.left ?: Int.MAX_VALUE
                      val nach = words.filter {
                          it.b.centerX() in lo..hi && abs(it.cy - p.cy) < win && it.t.any { c -> c.isLetter() }
                      }.sortedBy { it.b.left }.joinToString(" ") { it.t }.trim()
          
                      raw.add(R(name, num, dayW?.t?.toInt() ?: 0, nach, date))
                  }
                  // if a meeting day could not be read for a row, use the most common one on the sheet
                  val mode = raw.map { it.day }.filter { it > 0 }.groupingBy { it }.eachCount()
                      .maxByOrNull { it.value }?.key ?: 0
                  return raw.map { Client(it.name, it.phone, if (it.day > 0) it.day else mode, it.nach, it.last) }
              }
          }
          EOF_FILE
          mkdir -p app/src/main/java/com/example/smartdialer
          cat > app/src/main/java/com/example/smartdialer/OverlayService.kt <<'EOF_FILE'
          package com.example.smartdialer
          
          import android.app.Service
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.os.IBinder
          import android.telephony.PhoneStateListener
          import android.telephony.TelephonyManager
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          
          @Suppress("DEPRECATION")
          class OverlayService : Service() {
              private var view: View? = null
              private var wm: WindowManager? = null
              private var tm: TelephonyManager? = null
              private var listener: PhoneStateListener? = null
              private var sawOffhook = false
          
              override fun onBind(i: Intent?): IBinder? = null
          
              override fun onStartCommand(i: Intent?, flags: Int, startId: Int): Int {
                  i ?: return START_NOT_STICKY
                  val c = Client(
                      i.getStringExtra("name") ?: "", i.getStringExtra("phone") ?: "",
                      i.getIntExtra("day", 0), i.getStringExtra("nach") ?: "", i.getStringExtra("last") ?: ""
                  )
                  show(c)
                  listenForCallEnd()
                  return START_NOT_STICKY
              }
          
              private fun show(c: Client) {
                  removeView()
                  val late = c.isLate
                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 48, 40, 32)
                      setBackgroundColor(if (late) Color.parseColor("#D32F2F") else Color.parseColor("#2E7D32"))
                  }
                  fun tv(s: String, size: Float, bold: Boolean = false) = TextView(this).apply {
                      text = s; textSize = size; setTextColor(Color.WHITE)
                      if (bold) setTypeface(typeface, android.graphics.Typeface.BOLD)
                  }
                  box.addView(tv(c.name, 24f, true))
                  box.addView(tv("Loan day (meeting day): ${c.meetingDay}", 16f))
                  box.addView(tv("NACH: ${c.nach}", 16f))
                  box.addView(tv("Last paid on: ${c.lastPaid}", 16f))
                  if (late) box.addView(tv("DELAYED PAYMENT", 18f, true))
                  box.addView(Button(this).apply { text = "Hide"; setOnClickListener { stopSelf() } })
                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  ).apply { gravity = Gravity.TOP }
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  wm!!.addView(box, lp)
                  view = box
              }
          
              private fun listenForCallEnd() {
                  tm = getSystemService(TELEPHONY_SERVICE) as TelephonyManager
                  listener = object : PhoneStateListener() {
                      override fun onCallStateChanged(state: Int, number: String?) {
                          if (state == TelephonyManager.CALL_STATE_OFFHOOK) sawOffhook = true
                          if (state == TelephonyManager.CALL_STATE_IDLE && sawOffhook) stopSelf()
                      }
                  }
                  tm!!.listen(listener, PhoneStateListener.LISTEN_CALL_STATE)
              }
          
              private fun removeView() { view?.let { try { wm?.removeView(it) } catch (_: Exception) {} }; view = null }
          
              override fun onDestroy() {
                  listener?.let { tm?.listen(it, PhoneStateListener.LISTEN_NONE) }
                  removeView()
                  super.onDestroy()
              }
          }
          EOF_FILE
          mkdir -p app/src/main/java/com/example/smartdialer
          cat > app/src/main/java/com/example/smartdialer/MainActivity.kt <<'EOF_FILE'
          package com.example.smartdialer
          
          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.*
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat
          import androidx.core.content.FileProvider
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.text.TextRecognition
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions
          import java.io.File
          
          class MainActivity : AppCompatActivity() {
              private lateinit var listBox: LinearLayout
              private var photoUri: Uri? = null
              private var pending: Client? = null
              private var clients = listOf<Client>()
          
              private val takePic = registerForActivityResult(ActivityResultContracts.TakePicture()) { ok ->
                  if (ok) photoUri?.let { scan(it) }
              }
              private val pickPic = registerForActivityResult(ActivityResultContracts.GetContent()) { it?.let { u -> scan(u) } }
              private val perms = registerForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) { pending?.let { call(it) } }
          
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(24, 24, 24, 24) }
                  val bar = LinearLayout(this)
                  bar.addView(Button(this).apply {
                      text = "Scan sheet"
                      layoutParams = LinearLayout.LayoutParams(0, -2, 1f)
                      setOnClickListener {
                          val f = File(cacheDir, "sheet.jpg")
                          photoUri = FileProvider.getUriForFile(this@MainActivity, "$packageName.fileprovider", f)
                          takePic.launch(photoUri)
                      }
                  })
                  bar.addView(Button(this).apply {
                      text = "From gallery"
                      layoutParams = LinearLayout.LayoutParams(0, -2, 1f)
                      setOnClickListener { pickPic.launch("image/*") }
                  })
                  root.addView(bar)
                  listBox = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  root.addView(ScrollView(this).apply { addView(listBox) })
                  setContentView(root)
                  clients = Store.load(this)
                  render()
              }
          
              private fun scan(uri: Uri) {
                  Toast.makeText(this, "Reading sheet…", Toast.LENGTH_SHORT).show()
                  val rec = TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS)
                  rec.process(InputImage.fromFilePath(this, uri))
                      .addOnSuccessListener {
                          clients = SheetParser.parse(it)
                          Store.save(this, clients)
                          render()
                          if (clients.isEmpty()) Toast.makeText(this, "No rows found. Try a sharper, straighter photo.", Toast.LENGTH_LONG).show()
                      }
                      .addOnFailureListener { Toast.makeText(this, "Scan failed", Toast.LENGTH_LONG).show() }
              }
          
              private fun render() {
                  listBox.removeAllViews()
                  for (c in clients) {
                      val row = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(16, 24, 16, 24) }
                      row.addView(TextView(this).apply {
                          text = c.name; textSize = 20f
                          setTextColor(if (c.isLate) Color.parseColor("#D32F2F") else Color.parseColor("#2E7D32"))
                      })
                      row.addView(TextView(this).apply { text = c.phone; textSize = 14f })
                      row.setOnClickListener { call(c) }
                      listBox.addView(row)
                  }
              }
          
              private fun call(c: Client) {
                  pending = c
                  if (!Settings.canDrawOverlays(this)) {
                      Toast.makeText(this, "Allow 'display over other apps', then tap the name again", Toast.LENGTH_LONG).show()
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      return
                  }
                  val need = arrayOf(Manifest.permission.CALL_PHONE, Manifest.permission.READ_PHONE_STATE)
                      .filter { ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED }
                  if (need.isNotEmpty()) { perms.launch(need.toTypedArray()); return }
                  pending = null
                  startService(Intent(this, OverlayService::class.java)
                      .putExtra("name", c.name).putExtra("phone", c.phone).putExtra("day", c.meetingDay)
                      .putExtra("nach", c.nach).putExtra("last", c.lastPaid))
                  startActivity(Intent(Intent.ACTION_CALL, Uri.parse("tel:${c.phone}")))
              }
          }
          EOF_FILE
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SmartDialer-apk
          path: app/build/outputs/apk/debug/app-debug.apk
