name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create project files
        run: |
          printf 'android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2048m\n' > gradle.properties
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "SmartDialer"
          include(":app")
          EOF_FILE
          cat > build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.smartdialer"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.smartdialer"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.mlkit:text-recognition:16.0.1")
          }
          EOF_FILE
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/file_paths.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <paths><cache-path name="scans" path="." /></paths>
          EOF_FILE
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/themes.xml <<'EOF_FILE'
          <resources><style name="AppTheme" parent="Theme.AppCompat.DayNight.DarkActionBar" /></resources>
          EOF_FILE
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.READ_PHONE_STATE" />
              <uses-permission android:name="android.permission.READ_CALL_LOG" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.telephony" android:required="false" />
              <application android:label="Smart Dialer" android:theme="@style/AppTheme">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".OverlayService" android:exported="false" />
                  <provider android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false" android:grantUriPermissions="true">
                      <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p app/src/main/java/com/example/smartdialer
          cat > app/src/main/java/com/example/smartdialer/Client.kt <<'EOF_FILE'
          package com.example.smartdialer
          
          import android.content.Context
          import android.graphics.Rect
          import com.google.mlkit.vision.text.Text
          import org.json.JSONArray
          import org.json.JSONObject
          import java.text.SimpleDateFormat
          import java.util.Calendar
          import java.util.Locale
          import kotlin.math.abs
          
          data class Client(
              val name: String,
              val phone: String,
              val meetingDay: Int,
              val nach: String,
              val lastPaid: String // MM/dd/yyyy
          ) {
              /** Red rule: day-of-month of "last paid on" is later than the meeting day. */
              val isLate: Boolean
                  get() = try {
                      val f = SimpleDateFormat("M/d/yyyy", Locale.US).apply { isLenient = false }
                      val c = Calendar.getInstance().apply { time = f.parse(lastPaid)!! }
                      c.get(Calendar.DAY_OF_MONTH) > meetingDay
                  } catch (e: Exception) { false }
          }
          
          object Store {
              private const val PREF = "dialer"
              fun save(ctx: Context, list: List<Client>) {
                  val arr = JSONArray()
                  list.forEach {
                      arr.put(JSONObject().put("n", it.name).put("p", it.phone).put("d", it.meetingDay)
                          .put("h", it.nach).put("l", it.lastPaid))
                  }
                  ctx.getSharedPreferences(PREF, 0).edit().putString("clients", arr.toString()).apply()
              }
              fun load(ctx: Context): List<Client> {
                  val s = ctx.getSharedPreferences(PREF, 0).getString("clients", "[]")!!
                  val arr = JSONArray(s)
                  return (0 until arr.length()).map {
                      val o = arr.getJSONObject(it)
                      Client(o.getString("n"), o.getString("p"), o.getInt("d"), o.getString("h"), o.getString("l"))
                  }
              }
          }
          
          object SheetParser {
              private val dateFind = Regex("""\d{1,2}/\d{1,2}/\d{4}""")
              private val phoneRx = Regex("""^[6-9]\d{9}$""")
              private val dayRx = Regex("""^\d{1,2}$""")
          
              private class W(val t: String, val b: Rect) {
                  val cy: Int get() = b.centerY()
                  val cx: Int get() = b.centerX()
              }
          
              /** one table row: its phone number, name, and the cells found to the right of the phone (centre x, text) */
              private class T(val num: String, val name: String, val cells: List<Pair<Int, String>>)
          
              /** OCR often reads 0 as O and 1 as l/I inside dates. */
              private fun fixDate(s: String): String =
                  if (s.contains('/')) s.replace('O', '0').replace('o', '0').replace('l', '1').replace('I', '1').replace('|', '1') else s
          
              /** Reads a meeting day (1-31); tolerates B read for 8, O for 0, l/I for 1. */
              private fun toDay(s: String): Int? {
                  val t = s.trim().replace('B', '8').replace('O', '0').replace('o', '0').replace('l', '1').replace('I', '1')
                  return if (dayRx.matches(t)) t.toInt().takeIf { it in 1..31 } else null
              }
          
              /**
               * Standard sheet (counted by column, headers are NOT needed):
               *   1 code | 2 centre | 3 CUSTOMER NAME | 4 PHONE | 5 scheme | 6 loan | 7 EWI | 8 MEETING DAY | 9 NACH STATUS | 10 LAST PAID ON
               * Each phone number (column 4) anchors one row. Column 3 is the cell directly left of it.
               * Columns 5-10 are found by grouping the cells right of the phone into vertical columns across ALL rows
               * and counting them from the phone: 4th = meeting day, 5th = NACH, 6th = last paid.
               * Photo tilt is measured and corrected for, and blank cells simply stay blank.
               */
              fun parse(text: Text): List<Client> {
                  val words = mutableListOf<W>()
                  val lineBoxes = mutableListOf<W>()
                  for (blk in text.textBlocks) for (ln in blk.lines) {
                      ln.boundingBox?.let { lineBoxes.add(W(ln.text.trim(), it)) }
                      for (el in ln.elements) el.boundingBox?.let { words.add(W(el.text.trim(), it)) }
                  }
                  if (words.isEmpty()) return emptyList()
          
                  val phones = mutableListOf<Pair<String, W>>()
                  fun addPhone(num: String, w: W) {
                      if (phones.none { it.first == num && abs(it.second.cy - w.cy) < 10 }) phones.add(num to w)
                  }
                  words.forEach { if (phoneRx.matches(it.t)) addPhone(it.t, it) }
                  lineBoxes.forEach { val s = it.t.replace(" ", ""); if (phoneRx.matches(s)) addPhone(s, it) }
                  val sorted = phones.sortedBy { it.second.cy }
                  if (sorted.isEmpty()) return emptyList()
          
                  val diffs = sorted.zipWithNext { a, b -> b.second.cy - a.second.cy }.filter { it > 5 }.sorted()
                  val pitch = if (diffs.isEmpty()) 40 else diffs[diffs.size / 2]
                  val win = pitch * 0.5
                  val h = words.map { it.b.height() }.sorted()[words.size / 2]
                  val nameGap = h * 2.5   // max gap inside one name cell
                  val cellGap = h * 1.3   // gap that separates two cells on the right side
          
                  // measure photo tilt (vertical drift per horizontal pixel) using dates and meeting days
                  val tiltWords = words.filter { w -> dateFind.containsMatchIn(fixDate(w.t)) || toDay(w.t) != null }
                  var k = 0.0
                  repeat(4) {
                      val ks = mutableListOf<Double>()
                      for (w in tiltWords) {
                          val best = sorted.minByOrNull { abs(w.cy - (it.second.cy + k * (w.cx - it.second.cx))) } ?: continue
                          val dx = w.cx - best.second.cx
                          if (dx < 200) continue
                          val resid = w.cy - (best.second.cy + k * dx)
                          if (abs(resid) < pitch * 0.5) ks.add(k + resid / dx)
                      }
                      if (ks.isNotEmpty()) k = ks.sorted()[ks.size / 2]
                  }
                  val tilt = k
                  fun ey(p: W, w: W): Double = if (w.cx > p.cx) p.cy + tilt * (w.cx - p.cx) else p.cy.toDouble()
                  fun isDate(w: W) = dateFind.containsMatchIn(fixDate(w.t))
          
                  val rows = mutableListOf<T>()
                  for ((num, p) in sorted) {
                      // ---- column 3: customer name = the cell directly left of the phone
                      val leftWords = words.filter { it.b.right <= p.b.left + 15 && abs(it.cy - p.cy) < win }
                          .sortedByDescending { it.b.left }
                      val nameCell = mutableListOf<W>()
                      var prevLeft = p.b.left
                      for (w in leftWords) {
                          if (nameCell.isNotEmpty() && prevLeft - w.b.right > nameGap) break
                          nameCell.add(w)
                          prevLeft = w.b.left
                      }
                      val tokens = nameCell.sortedBy { it.b.left }
                          .map { w -> w.t.filter { c -> c.isLetter() || c == '.' } }
                          .filter { it.isNotEmpty() }
                      val firstUpper = tokens.firstOrNull()?.none { it.isLowerCase() } ?: false
                      val name = tokens.filter { !firstUpper || it.none { c -> c.isLowerCase() } }
                          .joinToString(" ").trim().ifEmpty { num }
          
                      // ---- columns 5..: cells right of the phone (a date is always its own cell)
                      val rightWords = words.filter { it.b.left > p.b.right - 5 && abs(it.cy - ey(p, it)) < win }
                          .sortedBy { it.b.left }
                      val cells = mutableListOf<MutableList<W>>()
                      for (w in rightWords) {
                          val last = cells.lastOrNull()
                          val startNew = last == null || isDate(w) || isDate(last.last()) ||
                              w.b.left - last.last().b.right > cellGap
                          if (startNew) cells.add(mutableListOf(w)) else last!!.add(w)
                      }
                      rows.add(T(num, name, cells.map { c ->
                          Pair((c.first().b.left + c.last().b.right) / 2, c.joinToString(" ") { it.t })
                      }))
                  }
          
                  // ---- group cells into vertical columns across all rows (centre x of cells in one column is the same)
                  val centers = rows.flatMap { r -> r.cells.map { it.first } }.sorted()
                  val bounds = mutableListOf<Int>()
                  for (i in 1 until centers.size) {
                      if (centers[i] - centers[i - 1] > h * 3) bounds.add((centers[i] + centers[i - 1]) / 2)
                  }
                  val nCols = bounds.size + 1
                  val grid = rows.map { r ->
                      val arr = Array(nCols) { "" }
                      for ((cx, t) in r.cells) {
                          val i = bounds.count { it < cx }
                          arr[i] = (arr[i] + " " + t).trim()
                      }
                      arr
                  }
          
                  // counting from the phone: 4th column right of it = meeting day (8), 5th = NACH (9), 6th = last paid (10)
                  var dayIdx = 3
                  var nachIdx = 4
                  var dateIdx = 5
                  fun dateCount(c: Int) = grid.count { dateFind.containsMatchIn(fixDate(it.getOrNull(c) ?: "")) }
                  if (nCols < 6 || dateCount(5) * 10 < grid.size * 3) {
                      // safety net: column count did not give a column of dates, so locate the dates column and count back from it
                      val best = (0 until nCols).maxByOrNull { dateCount(it) }
                      if (best != null && dateCount(best) > 0 && best >= 2) {
                          dateIdx = best; nachIdx = best - 1; dayIdx = best - 2
                      }
                  }
          
                  val days = grid.map { g ->
                      (g.getOrNull(dayIdx) ?: "").split(" ").firstNotNullOfOrNull { toDay(it) } ?: 0
                  }
                  // the meeting day is normally the same for the whole sheet: if 80%+ agree, use it for every row
                  val counts = days.filter { it > 0 }.groupingBy { it }.eachCount()
                  val top = counts.maxByOrNull { it.value }
                  val mode = top?.key ?: 0
                  val unify = top != null && top.value >= 0.8 * counts.values.sum()
          
                  return rows.mapIndexed { i, r ->
                      val nach = (grid[i].getOrNull(nachIdx) ?: "").filter { it.isLetter() || it == ' ' }.trim()
                      val last = dateFind.find(fixDate(grid[i].getOrNull(dateIdx) ?: ""))?.value ?: ""
                      Client(r.name, r.num, if (unify || days[i] == 0) mode else days[i], nach, last)
                  }
              }
          }
          EOF_FILE
          mkdir -p app/src/main/java/com/example/smartdialer
          cat > app/src/main/java/com/example/smartdialer/OverlayService.kt <<'EOF_FILE'
          package com.example.smartdialer
          
          import android.app.Service
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.provider.CallLog
          import android.telecom.TelecomManager
          import android.telephony.PhoneStateListener
          import android.telephony.TelephonyManager
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          
          @Suppress("DEPRECATION")
          class OverlayService : Service() {
              private var view: View? = null
              private var wm: WindowManager? = null
              private var tm: TelephonyManager? = null
              private var listener: PhoneStateListener? = null
              private val handler = Handler(Looper.getMainLooper())
              private var statusTv: TextView? = null
              private var client: Client? = null
              private var sawOffhook = false
              private var total = 1
              private var attemptNo = 1
              private val waitSeconds = 30   // pause between redial attempts
          
              override fun onBind(i: Intent?): IBinder? = null
          
              override fun onStartCommand(i: Intent?, flags: Int, startId: Int): Int {
                  i ?: return START_NOT_STICKY
                  val c = Client(
                      i.getStringExtra("name") ?: "", i.getStringExtra("phone") ?: "",
                      i.getIntExtra("day", 0), i.getStringExtra("nach") ?: "", i.getStringExtra("last") ?: ""
                  )
                  handler.removeCallbacksAndMessages(null)
                  client = c
                  total = i.getIntExtra("attempts", 1).coerceAtLeast(1)
                  attemptNo = 1
                  sawOffhook = false
                  show(c)
                  if (listener == null) listenForCallEnd()
                  return START_NOT_STICKY
              }
          
              private fun show(c: Client) {
                  removeView()
                  val late = c.isLate
                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 48, 40, 32)
                      setBackgroundColor(if (late) Color.parseColor("#D32F2F") else Color.parseColor("#2E7D32"))
                  }
                  fun tv(s: String, size: Float, bold: Boolean = false) = TextView(this).apply {
                      text = s; textSize = size; setTextColor(Color.WHITE)
                      if (bold) setTypeface(typeface, android.graphics.Typeface.BOLD)
                  }
                  box.addView(tv(c.name, 24f, true))
                  box.addView(tv("Loan day (meeting day): ${c.meetingDay}", 16f))
                  box.addView(tv("NACH: ${c.nach}", 16f))
                  box.addView(tv("Last paid on: ${c.lastPaid}", 16f))
                  if (late) box.addView(tv("DELAYED PAYMENT", 18f, true))
                  if (total > 1) {
                      statusTv = tv("Attempt 1 of $total", 16f, true)
                      box.addView(statusTv)
                  } else statusTv = null
                  box.addView(Button(this).apply {
                      text = if (total > 1) "Stop redial" else "Hide"
                      setOnClickListener { stopSelf() }
                  })
                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  ).apply { gravity = Gravity.TOP }
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  wm!!.addView(box, lp)
                  view = box
              }
          
              private fun listenForCallEnd() {
                  tm = getSystemService(TELEPHONY_SERVICE) as TelephonyManager
                  listener = object : PhoneStateListener() {
                      override fun onCallStateChanged(state: Int, number: String?) {
                          if (state == TelephonyManager.CALL_STATE_OFFHOOK) sawOffhook = true
                          if (state == TelephonyManager.CALL_STATE_IDLE && sawOffhook) {
                              sawOffhook = false
                              onCallEnded()
                          }
                      }
                  }
                  tm!!.listen(listener, PhoneStateListener.LISTEN_CALL_STATE)
              }
          
              private fun onCallEnded() {
                  if (total <= 1) { stopSelf(); return }
                  // give Android a moment to write the call to the call log, then see how long it lasted
                  handler.postDelayed({ checkAndMaybeRedial() }, 3000)
              }
          
              private fun checkAndMaybeRedial() {
                  val c = client ?: return
                  val duration = lastOutgoingDuration(c.phone)
                  when {
                      duration == null || duration > 0 -> stopSelf()          // answered (or cannot tell): stop
                      attemptNo >= total -> {                                  // last attempt, still no answer
                          statusTv?.text = "No answer after $total attempts"
                          handler.postDelayed({ stopSelf() }, 6000)
                      }
                      else -> startCountdown(waitSeconds)
                  }
              }
          
              /** Duration in seconds of the most recent outgoing call to [phone]; 0 = nobody answered. null = unknown. */
              private fun lastOutgoingDuration(phone: String): Int? {
                  return try {
                      contentResolver.query(
                          CallLog.Calls.CONTENT_URI,
                          arrayOf(CallLog.Calls.NUMBER, CallLog.Calls.DURATION, CallLog.Calls.TYPE),
                          null, null, CallLog.Calls.DATE + " DESC"
                      )?.use { cur ->
                          if (cur.moveToFirst()) {
                              val num = (cur.getString(0) ?: "").filter { it.isDigit() }
                              val dur = cur.getInt(1)
                              val type = cur.getInt(2)
                              if (type == CallLog.Calls.OUTGOING_TYPE && num.endsWith(phone.takeLast(10))) dur else null
                          } else null
                      }
                  } catch (e: Exception) { null }
              }
          
              private fun startCountdown(sec: Int) {
                  var left = sec
                  val r = object : Runnable {
                      override fun run() {
                          if (left > 0) {
                              statusTv?.text = "No answer. Redialing in ${left}s (attempt ${attemptNo + 1} of $total)"
                              left--
                              handler.postDelayed(this, 1000)
                          } else redial()
                      }
                  }
                  handler.post(r)
              }
          
              private fun redial() {
                  val c = client ?: return
                  attemptNo++
                  statusTv?.text = "Calling... attempt $attemptNo of $total"
                  sawOffhook = false
                  try {
                      (getSystemService(TELECOM_SERVICE) as TelecomManager).placeCall(Uri.parse("tel:${c.phone}"), Bundle())
                  } catch (e: Exception) {
                      stopSelf()
                  }
              }
          
              private fun removeView() { view?.let { try { wm?.removeView(it) } catch (_: Exception) {} }; view = null }
          
              override fun onDestroy() {
                  handler.removeCallbacksAndMessages(null)
                  listener?.let { tm?.listen(it, PhoneStateListener.LISTEN_NONE) }
                  listener = null
                  removeView()
                  super.onDestroy()
              }
          }
          EOF_FILE
          mkdir -p app/src/main/java/com/example/smartdialer
          cat > app/src/main/java/com/example/smartdialer/MainActivity.kt <<'EOF_FILE'
          package com.example.smartdialer
          
          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.text.InputType
          import android.view.Gravity
          import android.widget.*
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat
          import androidx.core.content.FileProvider
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.text.TextRecognition
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions
          import java.io.File
          
          class MainActivity : AppCompatActivity() {
              private lateinit var listBox: LinearLayout
              private lateinit var attemptsEt: EditText
              private var photoUri: Uri? = null
              private var pending: Client? = null
              private var clients = listOf<Client>()
          
              private val takePic = registerForActivityResult(ActivityResultContracts.TakePicture()) { ok ->
                  if (ok) photoUri?.let { scan(it) }
              }
              private val pickPic = registerForActivityResult(ActivityResultContracts.GetContent()) { it?.let { u -> scan(u) } }
              private val perms = registerForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) { pending?.let { call(it) } }
          
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  title = "Smart Dialer v6"
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(24, 24, 24, 24) }
                  val bar = LinearLayout(this)
                  bar.addView(Button(this).apply {
                      text = "Scan sheet"
                      layoutParams = LinearLayout.LayoutParams(0, -2, 1f)
                      setOnClickListener {
                          val f = File(cacheDir, "sheet.jpg")
                          photoUri = FileProvider.getUriForFile(this@MainActivity, "$packageName.fileprovider", f)
                          takePic.launch(photoUri)
                      }
                  })
                  bar.addView(Button(this).apply {
                      text = "From gallery"
                      layoutParams = LinearLayout.LayoutParams(0, -2, 1f)
                      setOnClickListener { pickPic.launch("image/*") }
                  })
                  root.addView(bar)
                  val attemptRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(8, 16, 8, 8)
                  }
                  attemptRow.addView(TextView(this).apply {
                      text = "Call attempts (1 = no redial)"
                      textSize = 15f
                      layoutParams = LinearLayout.LayoutParams(0, -2, 1f)
                  })
                  attemptsEt = EditText(this).apply {
                      inputType = InputType.TYPE_CLASS_NUMBER
                      setText("1")
                      setSelectAllOnFocus(true)
                      gravity = Gravity.CENTER
                      minEms = 3
                  }
                  attemptRow.addView(attemptsEt)
                  root.addView(attemptRow)
                  listBox = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  root.addView(ScrollView(this).apply { addView(listBox) })
                  setContentView(root)
                  clients = Store.load(this)
                  render()
              }
          
              private fun scan(uri: Uri) {
                  Toast.makeText(this, "Reading sheet…", Toast.LENGTH_SHORT).show()
                  val rec = TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS)
                  rec.process(InputImage.fromFilePath(this, uri))
                      .addOnSuccessListener {
                          clients = SheetParser.parse(it)
                          Store.save(this, clients)
                          render()
                          if (clients.isEmpty()) Toast.makeText(this, "No rows found. Try a sharper, straighter photo.", Toast.LENGTH_LONG).show()
                      }
                      .addOnFailureListener { Toast.makeText(this, "Scan failed", Toast.LENGTH_LONG).show() }
              }
          
              private fun render() {
                  listBox.removeAllViews()
                  for (c in clients) {
                      val row = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(16, 24, 16, 24) }
                      row.addView(TextView(this).apply {
                          text = c.name; textSize = 20f
                          setTextColor(if (c.isLate) Color.parseColor("#D32F2F") else Color.parseColor("#2E7D32"))
                      })
                      row.addView(TextView(this).apply { text = c.phone; textSize = 14f })
                      row.setOnClickListener { call(c) }
                      listBox.addView(row)
                  }
              }
          
              private fun call(c: Client) {
                  pending = c
                  if (!Settings.canDrawOverlays(this)) {
                      Toast.makeText(this, "Allow 'display over other apps', then tap the name again", Toast.LENGTH_LONG).show()
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      return
                  }
                  val attempts = (attemptsEt.text.toString().toIntOrNull() ?: 1).coerceIn(1, 20)
                  val wanted = mutableListOf(Manifest.permission.CALL_PHONE, Manifest.permission.READ_PHONE_STATE)
                  if (attempts > 1) wanted.add(Manifest.permission.READ_CALL_LOG)
                  val need = wanted
                      .filter { ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED }
                  if (need.isNotEmpty()) { perms.launch(need.toTypedArray()); return }
                  pending = null
                  startService(Intent(this, OverlayService::class.java)
                      .putExtra("name", c.name).putExtra("phone", c.phone).putExtra("day", c.meetingDay)
                      .putExtra("nach", c.nach).putExtra("last", c.lastPaid).putExtra("attempts", attempts))
                  startActivity(Intent(Intent.ACTION_CALL, Uri.parse("tel:${c.phone}")))
              }
          }
          EOF_FILE
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SmartDialer-apk
          path: app/build/outputs/apk/debug/app-debug.apk
